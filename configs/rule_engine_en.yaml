# =============================================================================
# English rule-engine configuration.
#
# Same normalization / obfuscation / matching / scoring as the Vietnamese
# engine; only the lexicon changes.  The English lexicon ships as a small
# seed set (review_status=auto) so the language router can be exercised
# end-to-end; promote entries to `verified` after human review.
# =============================================================================

lexicon_path: data/processed/lexicon/verified_lexicon_en_combined.csv
dictionary_version: v1-en-combined

# --- section 37: input normalization -------------------------------------- #
normalize:
  unicode_form: NFC
  lowercase: true
  remove_invisible: true
  collapse_whitespace: true
  max_repeat_char: 3
  max_text_chars: 20000

# --- section 38: anti-obfuscation matching views -------------------------- #
obfuscation:
  enabled: true
  accentless: true
  leet: true
  collapse_repeats: true
  separator_stripping: true
  min_compact_term_len: 3
  max_variant_chars: 40000

# --- dictionary matching --------------------------------------------------- #
matcher:
  min_term_len: 2
  fuzzy_enabled: true
  fuzzy_max_distance: 1
  fuzzy_min_term_len: 6
  max_matches: 200

# --- section 39: scoring --------------------------------------------------- #
scoring:
  severity:
    HATE: 0.90
    OFFENSIVE: 0.60
  match_factors:
    exact: 1.00
    accentless_alias: 0.90
    leet: 0.80
    repeat_collapsed: 0.75
    separator_inserted: 0.80
    obfuscated_combined: 0.60
    fuzzy: 0.60
  negation_factor: 0.50
  quote_factor: 0.60
  context_required_factor: 0.85
  aggregation_cap: 10
  min_review_statuses:
    - verified
    - auto
