# =============================================================================
# Rule engine configuration - TUNED + PRUNED variant (lexicon-size ablation)
#   identical to rule_engine_tuned.yaml EXCEPT lexicon_path (isolate lexicon size)
#   prune gate: tfidf-min-score=0.015 -> 324 terms (full = 922)
#
#   python scripts/17_evaluate_rule_engine.py --config configs/rule_engine_tuned.yaml
#
# Tuning note (validation-only, section 39/44):
#   `scoring.match_factors.accentless_alias` was lowered 0.90 -> 0.15.
#   Section 38 labels the accentless view an AUXILIARY signal, yet it matched
#   with 90% confidence. Dropping diacritics makes slur forms collide with
#   common Vietnamese syllables (đứng, mẹ, đồ, cám, sao, vào, ...), which
#   dominated the CLEAN false positives. Demoting the factor is a robust win:
#   validation macro-F1 0.4469 -> 0.5086 and 5-fold nested CV 0.4385 -> 0.4887,
#   improving HATE (0.366 -> 0.475), OFFENSIVE (0.126 -> 0.155) and CLEAN
#   (0.849 -> 0.896) at once. The best lexicons remains the gated one
#   (verified_lexicon.csv, 1828 entries); the pruned 1096-entry lexicon did not
#   benefit. Every weight is still a heuristic hypothesis, not a probability.
# =============================================================================

lexicon_path: data/processed/lexicon/sweeps/pruned_score015/verified_lexicon_pruned.csv
dictionary_version: v1

# --- section 37: input normalization -------------------------------------- #
normalize:
  unicode_form: NFC
  lowercase: true
  remove_invisible: true
  collapse_whitespace: true
  max_repeat_char: 3        # "nguuuu" -> "nguu"; 0 disables the cap
  max_text_chars: 20000

# --- section 38: anti-obfuscation matching views -------------------------- #
obfuscation:
  enabled: true
  accentless: true           # "con cho"  (auxiliary signal only)
  leet: true                 # "c0n ch0"
  collapse_repeats: true     # "nguuu" -> "ngu"
  separator_stripping: true  # "n g u"
  min_compact_term_len: 3
  max_variant_chars: 40000

# --- dictionary matching --------------------------------------------------- #
matcher:
  min_term_len: 2
  fuzzy_enabled: true
  fuzzy_max_distance: 1
  fuzzy_min_term_len: 6
  max_matches: 200

# --- section 39: scoring --------------------------------------------------- #
scoring:
  severity:                  # label severity, section 39 table
    HATE: 0.90
    OFFENSIVE: 0.60
  match_factors:             # confidence of each match type
    exact: 1.00
    accentless_alias: 0.15   # TUNED: auxiliary signal (was 0.90)
    leet: 0.80
    repeat_collapsed: 0.75
    separator_inserted: 0.80
    obfuscated_combined: 0.60
    fuzzy: 0.60
  negation_factor: 0.50      # slur preceded by "không / chẳng / ..."
  quote_factor: 0.60         # slur inside quotation marks
  context_required_factor: 0.85
  aggregation_cap: 10        # max matches per label in 1 - prod(1 - s_i)
  min_review_statuses:       # which lexicon entries may match
    - verified
    - auto
