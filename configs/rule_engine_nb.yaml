# =============================================================================
# Rule engine configuration - Naive-Bayes multi-label lexicon (EXPERIMENT)
#
#   python scripts/17_evaluate_rule_engine.py --config configs/rule_engine_nb.yaml \
#       --split validation --out outputs/evaluation/rule_engine_nb
#
# Purpose: re-run the rule engine with the NB-generated lexicon
# (outputs/lexicon_experiments/nb_multilabel/lexicon_nb_best.csv, 1155 entries)
# instead of the frozen 668-entry verified_lexicon.csv, so the fusion can be
# re-measured on validation (scripts 40-42 -> 17 -> 19 -> 23 -> 25).
#
# Every scoring weight below is copied VERBATIM from configs/rule_engine_tuned.yaml
# (tuned on validation, plan section 44). ONLY `lexicon_path` differs, so any
# change in macro-F1 is attributable to the lexicon, not to the weights.
# No test split is touched beyond the single protocol pass; the frozen
# rule_engine_tuned artefacts are NOT overwritten (this writes to a fresh dir).
# =============================================================================

lexicon_path: outputs/lexicon_experiments/nb_multilabel/lexicon_nb_best.csv
dictionary_version: v1

# --- section 37: input normalization -------------------------------------- #
normalize:
  unicode_form: NFC
  lowercase: true
  remove_invisible: true
  collapse_whitespace: true
  max_repeat_char: 3        # "nguuuu" -> "nguu"; 0 disables the cap
  max_text_chars: 20000

# --- section 38: anti-obfuscation matching views -------------------------- #
obfuscation:
  enabled: true
  accentless: true           # "con cho"  (auxiliary signal only)
  leet: true                 # "c0n ch0"
  collapse_repeats: true         # "nguuu" -> "ngu"
  separator_stripping: true  # "n g u"
  min_compact_term_len: 3
  max_variant_chars: 40000

# --- dictionary matching --------------------------------------------------- #
matcher:
  min_term_len: 2
  fuzzy_enabled: true
  fuzzy_max_distance: 1
  fuzzy_min_term_len: 6
  max_matches: 200

# --- section 39: scoring (TUNED, see header) ------------------------------ #
scoring:
  severity:                  # label severity, section 39 table
    HATE: 0.9
    OFFENSIVE: 0.6
  match_factors:             # confidence of each match type (TUNED)
    exact: 1
    accentless_alias: 0
    leet: 0.8
    repeat_collapsed: 0.75
    separator_inserted: 0.8
    obfuscated_combined: 0.45
    fuzzy: 0.6
  negation_factor: 1      # slur preceded by "không / chẳng / ..."
  quote_factor: 0.6         # slur inside quotation marks
  context_required_factor: 0.85
  aggregation_cap: 10        # max matches per label in 1 - prod(1 - s_i)
  min_review_statuses:       # which lexicon entries may match
    - verified
    - auto
