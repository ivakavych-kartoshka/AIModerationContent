# =============================================================================
# Model 2 - sensitiveai-en-custom
#
# Measures the effect of the Custom Classification Head. Everything else is
# deliberately identical to the sensitiveai-en baseline to isolate the head.
#
#   python -m src.training.run_experiment --config configs/sensitiveai-en-custom.yaml
# =============================================================================
model_name: sensitiveai-en-custom
base_model: microsoft/mdeberta-v3-base
head: custom
seed: 42
deterministic: true

encoder_checkpoint: null

head_options:
  head_hidden_size: 512
  dropout: 0.1
  use_cls_pool: true
  use_mean_pool: true
  use_max_pool: true
  use_attention_pool: false
  use_class_prior: false

dataset:
  name: tdavidson/hate_speech_offensive
  splits_dir: data/splits_en
  text_column: text
  label_column: label
  num_labels: 3

tokenizer:
  max_length: 128
  padding: max_length
  truncation: true

training:
  batch_size: 16
  eval_batch_size: 32
  gradient_accumulation: 2
  epochs: 30
  learning_rate: 3.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  optimizer: adamw_torch
  scheduler: linear
  min_lr_ratio: 0.01
  max_grad_norm: 1.0
  precision: bf16
  gradient_checkpointing: true
  num_workers: 0
  log_every_n_steps: 100

loss:
  type: cross_entropy
  use_class_weight: false

dlr:
  enabled: false

thresholds:
  enabled: false

early_stopping:
  enabled: true
  metric: macro_f1
  mode: max
  patience: 6
  min_delta: 0.0

evaluation:
  decision_rule: argmax
  benchmark: true
  benchmark_batch_size: 32
  benchmark_warmup: 10
  benchmark_runs: 50
  save_predictions: true

output:
  save_checkpoints: true
  save_last_checkpoint: true
