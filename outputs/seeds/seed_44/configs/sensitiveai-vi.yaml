  gradient_checkpointing: true
  num_workers: 2
  log_every_n_steps: 100
loss:
  type: cross_entropy
  use_class_weight: false
dlr:
  enabled: false
thresholds:
  enabled: false
early_stopping:
  enabled: true
  metric: macro_f1
  mode: max
  patience: 6
  min_delta: 0.0
evaluation:
  decision_rule: argmax
  benchmark: true
  benchmark_batch_size: 32
  benchmark_warmup: 10
  benchmark_runs: 50
  save_predictions: true
output:
  save_checkpoints: true
  save_last_checkpoint: true
