# Per-seed config of sensitiveai-vi for seed=44
# Generated by scripts/09_seed_variance.py - do not edit by hand.
model_name: sensitiveai-vi
base_model: microsoft/mdeberta-v3-base
head: standard
seed: 44
deterministic: true
dataset:
  name: uitnlp/vihsd
  splits_dir: data/splits
  text_column: text
  label_column: label
  num_labels: 3
tokenizer:
  max_length: 256
  padding: max_length
  truncation: true
training:
  batch_size: 16
  eval_batch_size: 32
  gradient_accumulation: 2
  epochs: 30
  learning_rate: 3.0e-05
  weight_decay: 0.01
  warmup_ratio: 0.1
  optimizer: adamw_torch
  scheduler: linear
  min_lr_ratio: 0.01
